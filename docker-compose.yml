services:

  agriva-init:
    image: alpine:3.20
    container_name: agriva-init
    user: root
    volumes:
      - agriva-uploads:/app/uploads
    command: >
      sh -c "mkdir -p /app/uploads && chown -R 1001:1001 /app/uploads && echo 'agriva-init: /app/uploads chowned to 1001:1001'"
    restart: "no"
    networks:
      - agriva-network

  agriva:
    build: .
    image: agriva/backend:0.0.1-SNAPSHOT
    restart: unless-stopped
    ports:
      - "${AGRIVA_HOST_PORT:-8081}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SERVER_PORT: "8080"
      AGRIVA_UPLOADS_DIR: /app/uploads
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-agriva}
      DB_USERNAME: ${POSTGRES_USERNAME:-agriva}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-900}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@agriva.local}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-agriva-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD?ADMIN_PASSWORD is required}
      AGRIVA_FEEDING_INGREDIENTS_ENABLED: "true"
      AGRIVA_FEEDING_FORMULATION_ENABLED: "true"
      AGRIVA_FEEDING_PRODUCTION_ENABLED: "true"
      AGRIVA_FEEDING_CONSUMPTION_ENABLED: "true"
      AGRIVA_FEEDING_FORECAST_ENABLED: "true"
      AGRIVA_FEEDING_BULK_ENABLED: "true"
      AGRIVA_POULTRY_ENABLED: "true"
      AGRIVA_POULTRY_MORTALITY_ENABLED: "true"
      AGRIVA_POULTRY_WEIGHT_SAMPLES_ENABLED: "true"
      AGRIVA_POULTRY_EGG_RECORDS_ENABLED: "true"
      AGRIVA_POULTRY_FCR_ENABLED: "true"
      AGRIVA_FISHERY_ENABLED: "true"
    volumes:
      - agriva-uploads:/app/uploads
    depends_on:
      agriva-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - agriva-network

  postgres:
    image: postgres:17.4-alpine
    container_name: agriva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agriva}
      POSTGRES_USER: ${POSTGRES_USERNAME:-agriva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - agriva-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-agriva} -d ${POSTGRES_DB:-agriva}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8.0-alpine
    container_name: agriva-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - agriva-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: agriva-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - agriva-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: agriva-kafka-ui
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: agriva-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - agriva-network

  frontend:
    build:
      context: ../../WebstormProjects/Agriva-frontend
      dockerfile: Dockerfile
    image: agriva/frontend:0.0.1-SNAPSHOT
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - agriva
    networks:
      - agriva-network

networks:
  agriva-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  agriva-uploads: