# ---------- Datasource
spring.datasource.url=${TEST_DB_URL:jdbc:tc:postgresql:16:///agriva}
spring.datasource.username=${TEST_DB_USER:test}
spring.datasource.password=${TEST_DB_PASSWORD:test}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.clean-disabled=true

# ---------- Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.repositories.enabled=false

# ---------- Kafka (must match KafkaPublishService which sends raw POJOs)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.agriva.*
spring.kafka.listener.missing-topics-fatal=false

# ---------- Security (test-only)
agriva.security.jwt.secret=test-secret-that-is-at-least-64-characters-long-for-hs512-signing-algorithm-ok
agriva.security.password-reset.expose-token=true
agriva.security.password-reset.ttl-seconds=900
agriva.security.password.min-length=12
agriva.security.password.require-symbol=true
agriva.security.password.check-hibp=false

agriva.app.frontend-url=http://localhost:3000
agriva.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ---------- Validators (fast ticks for tests that rely on the scheduler)
agriva.income.validator.cron=*/15 * * * * *
agriva.income.validator.max-attempts=4
agriva.income.validator.batch-size=100
agriva.income.validator.retry-delay-minutes=0

agriva.expense.validator.cron=*/15 * * * * *
agriva.expense.validator.max-attempts=4
agriva.expense.validator.batch-size=100
agriva.expense.validator.retry-delay-minutes=0

agriva.salary.validator.retry-delay-minutes=0
agriva.task.validator.retry-delay-minutes=0
agriva.crop.validator.retry-delay-minutes=0
agriva.feeding.feeding.validator.retry-delay-minutes=0

# Feed validators are disabled by default; individual tests re-enable via @TestPropertySource.
agriva.feeding.ingredient.validator.cron=-
agriva.feeding.formulation.validator.cron=-
agriva.feeding.production.validator.cron=-
agriva.feeding.feeding.validator.cron=-

# ---------- Test admin
app.admin.email=admin@test.local
app.admin.username=test-admin
app.admin.password=TestAdminPass1

# ---------- Logging
logging.level.root=WARN
logging.level.com.agriva=INFO
logging.level.org.springframework.kafka=WARN
logging.level.org.apache.kafka=WARN

# ---------- Scheduler / task pools
spring.task.scheduling.pool.size=1

# ---------- Uploads
agriva.uploads.dir=${java.io.tmpdir}/agriva-test-uploads-${random.uuid}

# ---------- Feature flags
agriva.rate-limit.enabled=false
agriva.feeding.validator.per-farm-lock.enabled=false