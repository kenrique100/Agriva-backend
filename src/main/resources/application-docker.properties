
# ---------- Datasource ----------
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:agriva}
spring.datasource.username=${DB_USERNAME:agriva}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=AgrivaHikariPool

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ---------- Spring Modulith ----------
spring.modulith.events.jdbc.schema-initialization.enabled=true

# ---------- Redis ----------
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=3000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.repositories.enabled=false

# ---------- Kafka ----------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=agriva
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.agriva.*
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.listener.ack-mode=record

# ---------- JWT (REQUIRED by JwtService) ----------
agriva.security.jwt.secret=${JWT_SECRET:dev-only-secret-please-change-me-to-a-very-long-random-string-at-least-64-characters-long}agriva.security.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:900}

# ---------- CORS (REQUIRED by CorsConfig) ----------
agriva.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ---------- Admin bootstrap (optional) ----------
app.admin.email=${ADMIN_EMAIL:admin@agriva.local}
app.admin.username=${ADMIN_USERNAME:agriva-admin}
app.admin.password=${ADMIN_PASSWORD:change_me}

# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.agriva=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN