# ---------- Datasource ----------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agriva}
spring.datasource.username=${DB_USERNAME:agriva}
spring.datasource.password=${DB_PASSWORD:Bundes9898}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.pool-name=AgrivaHikariPool

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---------- Redis ----------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:Bundes9898}
spring.data.redis.repositories.enabled=false

# ---------- Kafka ----------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=agriva
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.agriva.*
spring.kafka.listener.missing-topics-fatal=false

# ---------- JWT ----------
agriva.security.jwt.secret=${JWT_SECRET:dev-only-secret-please-change-me-to-a-very-long-random-string-at-least-64-characters-long}
agriva.security.jwt.access-token-ttl-seconds=900

# ---------- Password reset (dev: expose token in JSON response) ----------
agriva.security.password-reset.expose-token=true
agriva.security.password-reset.ttl-seconds=900
agriva.app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# ---------- CORS ----------
agriva.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ---------- Admin bootstrap ----------
app.admin.email=${ADMIN_EMAIL:admin@agriva.local}
app.admin.username=${ADMIN_USERNAME:agriva-admin}
app.admin.password=${ADMIN_PASSWORD:change_me}

# ---------- Logging ----------
logging.level.com.agriva=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=INFO
