spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agriva}
spring.datasource.username=${DB_USERNAME:agriva}
spring.datasource.password=${DB_PASSWORD:Bundes9898}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.pool-name=AgrivaHikariPool

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:Bundes9898}
spring.data.redis.repositories.enabled=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.agriva.*
spring.kafka.listener.missing-topics-fatal=false

# Dev-only JWT fallback. production profiles do NOT have this fallback.
agriva.security.jwt.secret=${JWT_SECRET:dev-only-secret-please-change-me-to-a-very-long-random-string-at-least-64-characters-long}
agriva.security.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:86400}
agriva.security.password-reset.expose-token=true
agriva.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174}

app.admin.email=${ADMIN_EMAIL:admin@agriva.local}
app.admin.username=${ADMIN_USERNAME:agriva-admin}
app.admin.password=${ADMIN_PASSWORD:change_me}

agriva.uploads.dir=${AGRIVA_UPLOADS_DIR:uploads}

logging.level.com.agriva=${LOG_LEVEL:DEBUG}
logging.level.org.hibernate.SQL=WARN

# Fast feedback for the validators
agriva.income.validator.cron=*/15 * * * * *
agriva.expense.validator.cron=*/15 * * * * *
agriva.feeding.ingredient.validator.cron=*/15 * * * * *
agriva.feeding.formulation.validator.cron=*/15 * * * * *
agriva.feeding.production.validator.cron=*/15 * * * * *
agriva.feeding.feeding.validator.cron=*/15 * * * * *

agriva.feeding.validator.per-farm-lock.enabled=false