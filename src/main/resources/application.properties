spring.application.name=agriva
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.main.banner-mode=off
spring.cloud.config.enabled=false

server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Scheduler pool — was implicitly 1, serializing every @Scheduled job
spring.task.scheduling.pool.size=6
spring.task.execution.pool.core-size=8
spring.task.execution.pool.max-size=32

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.jakarta.persistence.query.timeout=30000
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Problem Details
spring.mvc.problemdetails.enabled=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=agriva

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# JWT
agriva.security.jwt.secret=${JWT_SECRET}
agriva.security.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
agriva.security.jwt.refresh-token-ttl-seconds=${JWT_REFRESH_TOKEN_TTL_SECONDS:604800}
agriva.security.jwt.issuer=agriva
agriva.security.password-reset.expose-token=${EXPOSE_RESET_TOKEN:false}
agriva.security.password-reset.ttl-seconds=900

#Rate limiting
agriva.rate-limit.enabled=true
agriva.rate-limit.login-per-minute=5
agriva.rate-limit.login-per-hour-per-user=10
agriva.rate-limit.forgot-password-per-hour-per-email=3
agriva.rate-limit.default-per-minute=120
agriva.rate-limit.upload-per-minute=30
agriva.rate-limit.register-per-hour-per-ip=5
agriva.rate-limit.sub-user-per-hour-per-user=30

agriva.app.frontend-url=${FRONTEND_URL:http://localhost:3000}
agriva.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
agriva.cors.allowed-headers=Authorization,Content-Type,X-Request-Id,X-Idempotency-Key

# Password policy
agriva.security.password.min-length=12
agriva.security.password.check-hibp=${PASSWORD_CHECK_HIBP:true}

# File uploads
agriva.uploads.dir=${AGRIVA_UPLOADS_DIR:uploads}
agriva.uploads.max-size-bytes=10485760
agriva.uploads.allowed-mime-types=application/pdf,image/png,image/jpeg,application/vnd.openxmlformats-officedocument.wordprocessingml.document

# Kafka
agriva.kafka.concurrency=${KAFKA_CONCURRENCY:3}
agriva.kafka.listener.error-handler.max-retries=3
agriva.kafka.listener.error-handler.backoff-ms=1000

# Circuit breakers
resilience4j.circuitbreaker.instances.kafkaProducer.sliding-window-size=20
resilience4j.circuitbreaker.instances.kafkaProducer.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.kafkaProducer.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.kafkaProducer.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.kafkaProducer.permitted-number-of-calls-in-half-open-state=5

resilience4j.circuitbreaker.instances.hibp.sliding-window-size=10
resilience4j.circuitbreaker.instances.hibp.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.hibp.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.hibp.wait-duration-in-open-state=60s

resilience4j.timelimiter.instances.hibp.timeout-duration=5s

# Logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:-}] %logger{36} - %msg%n
logging.pattern.correlation=[%X{requestId:-}]
logging.level.root=INFO
logging.level.com.agriva=${LOG_LEVEL:INFO}
spring.cache.type=caffeine

agriva.fishery.enabled=${AGRIVA_FISHERY_ENABLED:true}

# ---------- Poultry Foundation ----------
agriva.poultry.enabled=${AGRIVA_POULTRY_ENABLED:true}
agriva.poultry.mortality.enabled=${AGRIVA_POULTRY_MORTALITY_ENABLED:true}
agriva.poultry.weight-samples.enabled=${AGRIVA_POULTRY_WEIGHT_SAMPLES_ENABLED:true}
agriva.poultry.egg-records.enabled=${AGRIVA_POULTRY_EGG_RECORDS_ENABLED:true}
agriva.poultry.fcr.enabled=${AGRIVA_POULTRY_FCR_ENABLED:true}