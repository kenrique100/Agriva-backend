spring.application.name=agriva
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.main.banner-mode=off
spring.cloud.config.enabled=false

server.port=${SERVER_PORT:8081}
server.forward-headers-strategy=framework
server.shutdown=graceful

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true

agriva.security.jwt.secret=${JWT_SECRET}
agriva.security.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
agriva.security.password-reset.expose-token=${EXPOSE_RESET_TOKEN:false}
agriva.security.password-reset.ttl-seconds=900

agriva.app.frontend-url=${FRONTEND_URL:http://localhost:3000}
agriva.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

agriva.income.validator.cron=0 * * * * *
agriva.income.validator.batch-size=100
agriva.income.validator.max-attempts=4
agriva.income.validator.retry-delay-minutes=1

agriva.expense.validator.cron=0 * * * * *
agriva.expense.validator.batch-size=100
agriva.expense.validator.max-attempts=4
agriva.expense.validator.retry-delay-minutes=1

agriva.income.kafka.staging-topic=agriva.income.staging
agriva.income.kafka.staging-dlq-topic=agriva.income.staging.dlq
agriva.income.kafka.consumer-group=agriva-income-staging-consumer

agriva.expense.kafka.staging-topic=agriva.expense.staging
agriva.expense.kafka.staging-dlq-topic=agriva.expense.staging.dlq
agriva.expense.kafka.consumer-group=agriva-expense-staging-consumer

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.root=INFO
logging.level.com.agriva=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=INFO

# ---------- File Uploads ----------
# Env override exists so Docker can inject an absolute path (/app/uploads).
# Local dev falls back to a relative directory next to the jar.
agriva.uploads.dir=${AGRIVA_UPLOADS_DIR:uploads}